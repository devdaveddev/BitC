<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmLab</title>
<meta name="description" content="Live dashboard for a BitTorrent-style P2P swarm with an ML-adaptive unchoking strategy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%2322c55e'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322c55e' stroke-width='2' stroke-dasharray='4 4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#080c18; --panel:rgba(20,28,48,.66); --line:rgba(148,163,184,.18);
  --fg:#e8eefc; --mute:#93a3bf;
  --seed:#22c55e; --normal:#38bdf8; --adaptive:#fbbf24; --free:#f87171;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"]{
  --bg:#eef2fa; --panel:rgba(255,255,255,.8); --line:rgba(15,23,42,.14);
  --fg:#0f172a; --mute:#4b5a74;
  --seed:#15803d; --normal:#0369a1; --adaptive:#b45309; --free:#b91c1c;
}
*{box-sizing:border-box}
html{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Space Grotesk",system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(900px 500px at 12% -10%,rgba(56,189,248,.14),transparent 60%),
                   radial-gradient(800px 500px at 100% 0,rgba(251,191,36,.10),transparent 60%)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:8px 0 16px}
h1{margin:0;font-size:1.5rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
h1 small{font-weight:400;color:var(--mute);font-size:.9rem}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.chip{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;min-height:44px;cursor:pointer;transition:transform .15s var(--ease),border-color .15s;backdrop-filter:blur(10px)}
button:hover{border-color:var(--mute)} button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--adaptive);outline-offset:2px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);min-height:44px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.live .dot{background:var(--seed);box-shadow:0 0 0 0 var(--seed);animation:ping 1.6s infinite}
.stale .dot{background:var(--free)}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(14px);min-width:0}
.card h2{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:500}
.c-stats{grid-column:span 12;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.stat b{display:block;font-size:2rem;letter-spacing:-.03em;line-height:1.1}
.stat span{color:var(--mute);font-size:.85rem}
.c-net{grid-column:span 7} .c-ml{grid-column:span 5}
.c-peers{grid-column:span 12;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:0;background:none;border:0;backdrop-filter:none}
.c-feed{grid-column:span 12}
@media(max-width:900px){.c-net,.c-ml{grid-column:span 12}}
canvas{width:100%;height:auto;display:block;border-radius:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;display:inline-block}
.sw.seed{background:var(--seed);border-radius:3px}.sw.normal{background:var(--normal);border-radius:50%}
.sw.adaptive{background:var(--adaptive);clip-path:polygon(50% 0,100% 100%,0 100%)}.sw.freerider{background:var(--free);transform:rotate(45deg);width:10px;height:10px}
.bar{display:grid;grid-template-columns:130px 1fr 48px;align-items:center;gap:10px;margin:10px 0;font-size:.85rem}
.track{height:12px;border-radius:99px;background:rgba(148,163,184,.16);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .6s var(--ease);background:var(--normal)}
.bar.on .fill{background:var(--adaptive)} .bar.on{font-weight:700}
.feat{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.feat div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.feat b{display:block;font-size:1.05rem}.feat span{font-size:.7rem;color:var(--mute)}
.timeline{display:flex;height:22px;border-radius:8px;overflow:hidden;margin-top:14px;border:1px solid var(--line)}
.timeline i{display:block;height:100%;font-style:normal;font-size:.65rem;padding:3px 6px;overflow:hidden;white-space:nowrap;color:#0b1020;font-weight:700}
.peer{border-top:3px solid var(--c);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r);padding:16px;backdrop-filter:blur(14px)}
.peer header{padding:0 0 10px}
.peer h3{margin:0;font-size:1rem;display:flex;gap:8px;align-items:center}
.badge{font-size:.7rem;padding:2px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c);text-transform:uppercase;letter-spacing:.08em}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:3px;margin:8px 0}
.pieces i{aspect-ratio:1;border-radius:3px;background:rgba(148,163,184,.16);transition:background .4s,transform .4s var(--ease)}
.pieces i.h{background:var(--c);transform:scale(1)} .pieces i.new{animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(1.8);filter:brightness(2)}100%{transform:scale(1)}}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);flex-wrap:wrap;gap:6px}
table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:8px}
td,th{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line)} th{color:var(--mute);font-weight:500}
td:first-child,th:first-child{text-align:left}
.flag{color:var(--free);font-weight:700}
.feed{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;font-size:.8rem;display:grid;gap:4px}
.feed li{display:grid;grid-template-columns:72px 56px 1fr;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.k{font-weight:700;text-transform:uppercase;font-size:.7rem;letter-spacing:.08em}
.k.up{color:var(--seed)}.k.down{color:var(--normal)}.k.ml{color:var(--adaptive)}.k.fail{color:var(--free)}.k.done{color:var(--seed)}.k.net{color:var(--mute)}
.empty{padding:40px;text-align:center;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4.5" fill="var(--seed)"/><circle cx="16" cy="16" r="12.5" fill="none" stroke="var(--normal)" stroke-width="2" stroke-dasharray="4 4"/></svg>
      SwarmLab <small>BitTorrent swarm · adaptive unchoking</small>
    </h1>
    <div class="controls">
      <span id="status" class="status" role="status" aria-live="polite"><i class="dot"></i><span id="statusText">connecting…</span></span>
      <button id="modeBtn" type="button" aria-pressed="false">Demo mode</button>
      <button id="pauseBtn" type="button" aria-pressed="false">Pause</button>
      <button id="themeBtn" type="button" aria-label="Toggle light/dark theme">Theme</button>
    </div>
  </header>

  <main>
    <div class="grid">
      <section class="card c-stats" aria-label="Swarm summary" id="stats"></section>
      <section class="card c-net" aria-labelledby="netT">
        <h2 id="netT">Swarm topology</h2>
        <canvas id="net" width="760" height="460" role="img" aria-label="Network graph of peers. Moving dots are pieces in transit."></canvas>
        <div class="legend">
          <span class="tag"><i class="sw seed"></i>seed</span><span class="tag"><i class="sw normal"></i>normal (tit-for-tat)</span>
          <span class="tag"><i class="sw adaptive"></i>adaptive (ML)</span><span class="tag"><i class="sw freerider"></i>freerider</span>
          <span class="tag">ring around a node = download progress · dashed = choked link</span>
        </div>
      </section>
      <section class="card c-ml" aria-labelledby="mlT">
        <h2 id="mlT">Adaptive peer · model reasoning</h2>
        <div id="ml"><p class="empty">Waiting for the adaptive peer’s first evaluation (every 30 s)…</p></div>
      </section>
      <section class="c-peers card" id="peers" aria-label="Peers"></section>
      <section class="card c-feed" aria-labelledby="feedT">
        <h2 id="feedT">Event feed</h2>
        <ul class="feed mono" id="feed"></ul>
      </section>
    </div>
  </main>
</div>

<script>
"use strict";
const ROLE = {
  seed:      {c:'var(--seed)',     shape:'square'},
  normal:    {c:'var(--normal)',   shape:'circle'},
  adaptive:  {c:'var(--adaptive)', shape:'triangle'},
  freerider: {c:'var(--free)',     shape:'diamond'},
};
const STRATS = ['TIT_FOR_TAT','STRICT_MODE','EXPLORATION_MODE'];
const FEATS = ['avg recip.','freerider %','churn/min','timeout','failure'];
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let state = {peers: []}, demo = false, paused = false, lastOk = 0;
const seenEvents = new Set(), particles = [];

/* ───────────── theme / controls ───────────── */
function applyTheme(t){document.documentElement.dataset.theme = t; store.set('theme', t)}
applyTheme(store.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
$('pauseBtn').onclick = e => {paused = !paused; e.target.setAttribute('aria-pressed', paused); e.target.textContent = paused ? 'Resume' : 'Pause'};
$('modeBtn').onclick = e => setDemo(!demo);
function setDemo(on){
  demo = on; $('modeBtn').setAttribute('aria-pressed', on); $('modeBtn').textContent = on ? 'Use live data' : 'Demo mode';
  seenEvents.clear(); particles.length = 0; if (on) Sim.reset();
}

/* ───────────── data ───────────── */
async function poll(){
  if (paused) return;
  if (demo) { state = Sim.step(); lastOk = Date.now(); return render(); }
  try {
    const r = await fetch('/api/state', {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    state = await r.json(); lastOk = Date.now(); render();
  } catch {
    // No backend (e.g. static hosting): fall back to demo automatically, once.
    if (!lastOk && !store.get('noAutoDemo')) { setDemo(true); }
    setStatus('offline');
  }
}
function setStatus(kind){
  const el = $('status'); el.className = 'status ' + (kind === 'live' ? 'live' : kind === 'stale' || kind === 'offline' ? 'stale' : '');
  $('statusText').textContent = {live: demo ? 'demo simulation' : 'live', stale:'stale – no recent update', offline:'no backend – start dashboard.py', wait:'waiting for peers…'}[kind];
}

/* ───────────── render ───────────── */
function pct(p){return p.total_pieces ? p.pieces.length / p.total_pieces : 0}
function render(){
  const ps = state.peers || [];
  const age = state.now - Math.max(0, ...ps.map(p => p.updated || 0));
  setStatus(!ps.length ? 'wait' : (!demo && age > 6 ? 'stale' : 'live'));
  renderStats(ps); renderPeers(ps); renderML(ps); renderFeed(ps); harvestEvents(ps);
}
function renderStats(ps){
  const dl = ps.filter(p => p.role !== 'seed');
  const done = dl.filter(p => p.completed_at).length;
  const avg = dl.length ? dl.reduce((a,p) => a + pct(p), 0) / dl.length : 0;
  const up = ps.reduce((a,p) => a + p.peers.reduce((b,m) => b + m.uploaded, 0), 0);
  const fr = ps.filter(p => p.role === 'adaptive').flatMap(p => p.peers.filter(m => m.freerider)).length;
  const items = [[ps.length,'peers online'],[Math.round(avg*100)+'%','avg download'],[done+'/'+dl.length,'completed'],[(up/1024).toFixed(1)+' KiB','served so far'],[fr,'freeriders flagged']];
  $('stats').innerHTML = items.map(([v,l]) => `<div class="stat"><b class="mono">${esc(v)}</b><span>${l}</span></div>`).join('');
}
function renderPeers(ps){
  if (!ps.length) { $('peers').innerHTML = '<p class="empty">No telemetry yet. Run <code class="mono">python run_simulation.py --dashboard</code> or press Demo mode.</p>'; return; }
  const root = $('peers'); root.className = 'c-peers';
  root.innerHTML = ps.map(p => {
    const r = ROLE[p.role] || ROLE.normal, have = new Set(p.pieces);
    const cells = Array.from({length:p.total_pieces}, (_,i) => `<i class="${have.has(i)?'h':''}"></i>`).join('');
    const rows = p.peers.map(m => `<tr><td>:${m.port}${m.freerider && p.role !== 'seed' ? ' <span class="flag" title="freerider">⚑</span>':''}</td><td>${(m.uploaded/1024).toFixed(1)}</td><td>${(m.downloaded/1024).toFixed(1)}</td><td>${m.reciprocity.toFixed(2)}</td><td>${p.unchoked.includes(m.port)?'open':'choked'}</td></tr>`).join('');
    return `<article class="peer" style="--c:${r.c}" aria-label="Peer ${p.port}">
      <header><h3 class="mono">:${p.port} <span class="badge">${esc(p.role)}</span></h3><span class="mono" style="font-size:.8rem">${esc(p.strategy.replace('_',' ').toLowerCase())}</span></header>
      <div class="pieces" role="img" aria-label="${p.pieces.length} of ${p.total_pieces} pieces">${cells}</div>
      <div class="meta"><span>${p.pieces.length}/${p.total_pieces} pieces</span><span>${p.completed_at ? 'complete ✓' : Math.round(pct(p)*100)+'%'}</span></div>
      ${p.peers.length ? `<table class="mono"><thead><tr><th>peer</th><th>↑KiB</th><th>↓KiB</th><th>recip.</th><th>link</th></tr></thead><tbody>${rows}</tbody></table>`:''}
    </article>`;
  }).join('');
}
function renderML(ps){
  const a = ps.find(p => p.role === 'adaptive');
  if (!a || !a.features.length) return;
  const bars = STRATS.map((s,i) => `<div class="bar ${a.strategy===s?'on':''}"><span class="mono">${s.replace('_MODE','').replace('_',' ')}</span><div class="track" role="progressbar" aria-valuenow="${Math.round(a.proba[i]*100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${s}"><div class="fill" style="width:${a.proba[i]*100}%"></div></div><span class="mono">${Math.round(a.proba[i]*100)}%</span></div>`).join('');
  const feats = a.features.map((f,i) => `<div><b class="mono">${f.toFixed(2)}</b><span>${FEATS[i]}</span></div>`).join('');
  const hist = a.strategy_history, t0 = hist[0][0], t1 = Math.max(state.now, hist[hist.length-1][0] + 1);
  const cols = {TIT_FOR_TAT:'var(--normal)', STRICT_MODE:'var(--free)', EXPLORATION_MODE:'var(--seed)'};
  const tl = hist.map(([t,s],i) => {const end = i+1 < hist.length ? hist[i+1][0] : t1; return `<i style="width:${(end-t)/(t1-t0)*100}%;background:${cols[s]}" title="${s}">${s.split('_')[0]}</i>`}).join('');
  $('ml').innerHTML = `<p style="margin:0 0 4px;color:var(--mute);font-size:.85rem">RandomForest class probabilities from live swarm features. The peer only switches after <b>2 consecutive</b> predictions above <b>55%</b> confidence.</p>${bars}<div class="feat mono">${feats}</div><div class="timeline" aria-label="Strategy timeline">${tl}</div>`;
}
function renderFeed(ps){
  const ev = ps.flatMap(p => (p.events||[]).map(e => ({...e, port:p.port}))).sort((a,b) => b.t - a.t).slice(0, 40);
  $('feed').innerHTML = ev.map(e => `<li><span>${new Date(e.t*1000).toLocaleTimeString([], {hour12:false})}</span><span class="k ${e.kind}">${e.kind}</span><span>:${e.port} ${esc(e.text)}</span></li>`).join('') || '<li>no events yet</li>';
}
function harvestEvents(ps){
  for (const p of ps) for (const e of (p.events||[])) {
    const key = p.port + '|' + e.t + '|' + e.text; if (seenEvents.has(key)) continue; seenEvents.add(key);
    if (seenEvents.size > 4000) seenEvents.clear();
    const m = /piece (\d+) → (\d+)/.exec(e.text);
    if (e.kind === 'up' && m && !reduced && Date.now()/1000 - e.t < 4) particles.push({from:p.port, to:+m[2], t:0, c:(ROLE[p.role]||ROLE.normal).c});
  }
}

/* ───────────── network canvas ───────────── */
const cv = $('net'), cx = cv.getContext('2d');
function cssVar(v){ return v.startsWith('var(') ? getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim() : v }
function layout(ps){
  const W = cv.width, H = cv.height, R = Math.min(W,H)*0.34, pos = {};
  ps.forEach((p,i) => { const a = -Math.PI/2 + i*2*Math.PI/ps.length; pos[p.port] = {x:W/2 + R*1.25*Math.cos(a), y:H/2 + R*Math.sin(a)}; });
  return pos;
}
function drawNode(x, y, shape, r, col){
  cx.beginPath();
  if (shape === 'circle') cx.arc(x, y, r, 0, 7);
  else if (shape === 'square') cx.roundRect(x-r, y-r, 2*r, 2*r, 6);
  else if (shape === 'triangle') { cx.moveTo(x, y-r*1.15); cx.lineTo(x+r*1.1, y+r*.85); cx.lineTo(x-r*1.1, y+r*.85); cx.closePath(); }
  else { cx.moveTo(x, y-r*1.2); cx.lineTo(x+r*1.2, y); cx.lineTo(x, y+r*1.2); cx.lineTo(x-r*1.2, y); cx.closePath(); }
  cx.fillStyle = col; cx.fill();
}
function frame(){
  const ps = state.peers || [], pos = layout(ps), fg = cssVar('var(--fg)'), mute = cssVar('var(--mute)');
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.lineWidth = 1.5;
  for (const p of ps) for (const q of p.connected) {
    if (q < p.port || !pos[q]) continue; // draw each link once
    const a = pos[p.port], b = pos[q], open = p.unchoked.includes(q) || (ps.find(x => x.port === q)||{unchoked:[]}).unchoked.includes(p.port) || p.role === 'seed' || (ps.find(x => x.port === q)||{}).role === 'seed';
    cx.setLineDash(open ? [] : [5,6]); cx.strokeStyle = open ? mute : cssVar('var(--free)'); cx.globalAlpha = open ? .55 : .35;
    cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke();
  }
  cx.setLineDash([]); cx.globalAlpha = 1;
  for (let i = particles.length-1; i >= 0; i--) {
    const q = particles[i], a = pos[q.from], b = pos[q.to]; q.t += .018;
    if (!a || !b || q.t >= 1) { particles.splice(i,1); continue; }
    const e = q.t*q.t*(3-2*q.t);
    cx.fillStyle = cssVar(q.c); cx.shadowColor = cssVar(q.c); cx.shadowBlur = 12;
    cx.beginPath(); cx.arc(a.x+(b.x-a.x)*e, a.y+(b.y-a.y)*e, 5, 0, 7); cx.fill(); cx.shadowBlur = 0;
  }
  for (const p of ps) {
    const {x,y} = pos[p.port], r = ROLE[p.role] || ROLE.normal, col = cssVar(r.c);
    cx.lineWidth = 5; cx.strokeStyle = 'rgba(148,163,184,.2)'; cx.beginPath(); cx.arc(x, y, 34, 0, 7); cx.stroke();
    cx.strokeStyle = col; cx.beginPath(); cx.arc(x, y, 34, -Math.PI/2, -Math.PI/2 + 2*Math.PI*pct(p)); cx.stroke();
    drawNode(x, y, r.shape, 18, col);
    cx.fillStyle = fg; cx.font = '600 13px "JetBrains Mono",monospace'; cx.textAlign = 'center';
    cx.fillText(':' + p.port, x, y + 56);
    cx.fillStyle = mute; cx.font = '11px "JetBrains Mono",monospace'; cx.fillText(p.role, x, y + 71);
  }
  requestAnimationFrame(frame);
}

/* ───────────── demo simulator (same shape as /api/state) ───────────── */
const Sim = (() => {
  let s;
  const N = 48, ports = [[5001,'seed'],[5002,'normal'],[5003,'freerider'],[5004,'adaptive']];
  function reset(){
    s = {t0: Date.now()/1000, tick: 0, hist: [[Date.now()/1000,'TIT_FOR_TAT']], strat:'TIT_FOR_TAT', proba:[.8,.1,.1], feats:[],
      peers: ports.map(([port,role]) => ({port, role, pieces: role==='seed' ? [...Array(N).keys()] : [], completed_at:null, events:[], m:{}, unchoked:[]}))};
    s.peers.forEach(p => ports.forEach(([q]) => { if (q !== p.port) p.m[q] = {port:q, uploaded:0, downloaded:0, timeouts:0, failures:0}; }));
  }
  const ev = (p,kind,text) => { p.events.push({t:Date.now()/1000, kind, text}); if (p.events.length > 30) p.events.shift(); };
  const recip = m => m.uploaded === 0 ? (m.downloaded > 0 ? 1 : 0) : m.downloaded / m.uploaded;
  function step(){
    s.tick++; const now = Date.now()/1000;
    for (const p of s.peers) {
      if (p.role === 'seed' || p.pieces.length >= N) continue;
      for (let k = 0; k < 2; k++) {
        const need = [...Array(N).keys()].filter(i => !p.pieces.includes(i)); if (!need.length) break;
        const i = need[Math.random()*need.length|0];
        const donors = s.peers.filter(d => d !== p && d.pieces.includes(i)); if (!donors.length) continue;
        const d = donors[Math.random()*donors.length|0];
        const serve = d.role === 'seed' || (d.role === 'freerider' ? Math.random() < .05 : (s.strat === 'STRICT_MODE' && d.role === 'adaptive' && recip(d.m[p.port]) < .3 ? false : Math.random() < .8));
        if (!serve) { if (d.role==='freerider' && Math.random()<.3) ev(d,'net',`rejected piece ${i} from ${p.port}`); continue; }
        p.pieces.push(i); p.m[d.port].downloaded += 1024; d.m[p.port].uploaded += 1024;
        p.m[d.port].downloaded = p.m[d.port].downloaded; d.m[p.port].downloaded = d.m[p.port].downloaded;
        ev(d,'up',`piece ${i} → ${p.port}`); ev(p,'down',`piece ${i} ← ${d.port}`);
        if (p.pieces.length === N) { p.completed_at = now; ev(p,'done',`download complete in ${(now-s.t0).toFixed(1)}s`); }
      }
    }
    const a = s.peers.find(p => p.role === 'adaptive');
    if (s.tick % 12 === 0) {   // compressed "30 s" evaluation
      const ms = Object.values(a.m), fr = ms.filter(m => m.uploaded >= 1024 && recip(m) < .3).length;
      s.feats = [ms.reduce((x,m) => x + recip(m), 0)/ms.length, fr/ms.length, 1.5, .02, .01];
      const strict = s.feats[1] > .3;
      s.proba = strict ? [.12,.78,.10] : [.82,.08,.10];
      const next = strict ? 'STRICT_MODE' : 'TIT_FOR_TAT';
      if (next !== s.strat) { ev(a,'ml',`switched ${s.strat} → ${next} (${Math.round(s.proba[1]*100)}%)`); s.strat = next; s.hist.push([now,next]); }
      ms.forEach(m => { if (m.uploaded >= 1024 && recip(m) < .3) ev(a,'ml',`peer ${m.port} flagged as freerider (reciprocity ${recip(m).toFixed(2)})`); });
    }
    return {now, peers: s.peers.map(p => ({port:p.port, role:p.role, updated:now, started:s.t0, completed_at:p.completed_at, total_pieces:N,
      pieces:p.pieces, connected: ports.map(x => x[0]).filter(q => q !== p.port), unchoked: p.role==='seed' ? [] : Object.keys(p.m).map(Number).filter(q => !(p.role==='adaptive' && s.strat==='STRICT_MODE' && recip(p.m[q])<.3 && p.m[q].uploaded>=1024)),
      strategy: p.role==='adaptive' ? s.strat : 'TIT_FOR_TAT', strategy_history: p.role==='adaptive' ? s.hist : [[s.t0,'TIT_FOR_TAT']],
      features: p.role==='adaptive' ? s.feats : [], proba: p.role==='adaptive' ? s.proba : [0,0,0],
      peers: Object.values(p.m).map(m => ({...m, reciprocity:+recip(m).toFixed(3), down_rate:0, freerider:m.uploaded>=1024 && recip(m)<.3})), events:p.events}))};
  }
  return {reset, step};
})();

/* ───────────── boot ───────────── */
if (new URLSearchParams(location.search).has('demo')) setDemo(true);
poll(); setInterval(poll, 1000); requestAnimationFrame(frame);
</script>
